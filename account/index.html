<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0e12"><title>Create account · Game Club</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0e12;color:#f5f5f7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(440px,calc(100% - 32px));margin:48px auto}h1{font-size:32px;letter-spacing:-.04em;margin:10px 0}p{color:#b7bfcc;line-height:1.6}.eyebrow{font-size:11px;letter-spacing:.12em;color:#86dfb5}section{padding:24px;background:#171b22;border:1px solid #384252;border-radius:16px}form{display:grid;gap:12px}label{font-size:13px;font-weight:600}input{width:100%;min-height:48px;background:#0c1016;color:#fff;border:1px solid #6a7789;border-radius:8px;padding:12px;font:inherit}button{min-height:48px;border:0;border-radius:8px;padding:12px 16px;background:#82e3b5;color:#082b1c;font:700 15px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}button:disabled{opacity:.5}a{color:#a6d6ff}#status{min-height:24px;overflow-wrap:anywhere}#sessionCard{padding:14px;margin-bottom:18px;border:1px solid #48536a;border-radius:10px}#sessionCard p{margin:0 0 12px;overflow-wrap:anywhere}#signOutAccount{background:#28374b;color:#fff;width:100%}.switch{margin-bottom:0;font-size:14px}.destinations{display:flex;gap:20px;justify-content:center;margin-top:24px;font-size:14px}[hidden]{display:none!important}:focus-visible{outline:2px solid #a6d6ff;outline-offset:3px}
</style></head><body><main><p class="eyebrow">CABO · POKER · GAME CLUB</p><h1 id="authTitle">Create your account</h1><p id="authIntro">One account for both games and your communities.</p><section>
<div id="sessionCard" hidden><p id="currentAccount"></p><button id="signOutAccount" type="button">Sign out to use another account</button></div>
<form id="accountForm"><label for="accountEmail">Email address</label><input id="accountEmail" type="email" autocomplete="email" required><label for="accountPassword">Password</label><input id="accountPassword" type="password" autocomplete="new-password" minlength="8" required><small id="passwordHelp">Use at least 8 characters.</small><button id="submitAccount" type="submit">Create account</button></form>
<p id="status" role="status" aria-live="polite"></p><p class="switch"><a id="switchMode" href="?mode=signin">Already have an account? Sign in</a></p>
</section><nav class="destinations" aria-label="Open app"><a href="../">Cabo</a><a href="../poker/">Poker</a><a href="../community/">Game Club</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=1"></script></body></html>
